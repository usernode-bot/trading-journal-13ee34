<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Rounded-square tile: white fill, thin light-grey outline, transparent outside -->
  <rect x="16" y="16" width="992" height="992" rx="140" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="8"/>

  <!-- Thin base line under the bars -->
  <line x1="150" y1="840" x2="570" y2="840" stroke="#0F0F0F" stroke-width="14" stroke-linecap="round"/>

  <!-- Three bars rising left to right: small, medium, tall -->
  <g fill="#0F0F0F">
    <rect x="150" y="690" width="90" height="150" rx="12"/>
    <rect x="310" y="580" width="90" height="260" rx="12"/>
    <rect x="470" y="480" width="90" height="360" rx="12"/>
  </g>

  <!-- Rising zigzag trend line above the bars -->
  <polyline points="175,600 290,480 390,530 565,370" fill="none" stroke="#0F0F0F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A dot at every bend of the trend line -->
  <g fill="#0F0F0F">
    <circle cx="175" cy="600" r="16"/>
    <circle cx="290" cy="480" r="16"/>
    <circle cx="390" cy="530" r="16"/>
    <circle cx="565" cy="370" r="16"/>
  </g>

  <!-- Pencil at 45 degrees, tip pointing down-left toward the chart;
       a thin white gap separates the body from the eraser -->
  <g transform="rotate(135 764 316) translate(764 316)" fill="#0F0F0F">
    <!-- body and wood cone -->
    <path d="M190 0 L100 -30 H-120 V30 H100 Z"/>
    <!-- eraser with rounded far end -->
    <path d="M-134 -30 H-146 A30 30 0 0 0 -146 30 H-134 Z"/>
  </g>
</svg>
